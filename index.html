<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instant Resume Updater</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 8px;
            font-size: 32px;
        }

        .header p {
            color: #666;
            margin: 0;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            font-size: 21px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            min-height: 280px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .field {
            margin-bottom: 22px;
        }

        .generate-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .generate-btn:hover {
            background: #1d4ed8;
        }

        .generate-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        .loading {
            background: #eef2ff;
            color: #3730a3;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .output-section {
            display: none;
        }

        .output-box {
            min-height: 400px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 25px;
            background: white;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .secondary-btn {
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            background: #333;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .secondary-btn:hover {
            background: #111;
        }

        .tip {
            margin-top: 10px;
            font-size: 13px;
            color: #666;
        }

        @media (max-width: 700px) {
            .container {
                margin: 15px auto;
                padding: 12px;
            }

            .card {
                padding: 18px;
            }

            .header h1 {
                font-size: 26px;
            }
        }

        @media print {
            body {
                background: white;
            }

            .header,
            .input-section,
            .buttons,
            .status {
                display: none !important;
            }

            .container {
                max-width: 100%;
                margin: 0;
                padding: 0;
            }

            .card {
                box-shadow: none;
                padding: 0;
            }

            .output-section {
                display: block !important;
            }

            .output-box {
                border: none;
                padding: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Instant Resume Updater</h1>
        <p>Tailor your resume to a target job description using AI</p>
    </div>

    <!-- INPUT SECTION -->
    <div class="card input-section">

        <div class="field">
            <label for="resume">
                Current Resume
            </label>

            <textarea
                id="resume"
                placeholder="Paste your current resume here..."
            ></textarea>
        </div>

        <div class="field">
            <label for="jd">
                Target Job Description
            </label>

            <textarea
                id="jd"
                placeholder="Paste the target job description here..."
            ></textarea>
        </div>

        <button
            class="generate-btn"
            id="generateBtn"
            onclick="updateResume()"
        >
            Generate Updated Resume
        </button>

        <div id="loadingMessage" class="status loading">
            ⏳ Updating your resume. Please wait...
        </div>

        <div id="errorMessage" class="status error"></div>

        <div id="successMessage" class="status success">
            ✅ Resume updated successfully!
        </div>

        <div class="tip">
            Tip: For better results, provide the complete resume and complete job description.
        </div>

    </div>


    <!-- OUTPUT SECTION -->
    <div class="card output-section" id="outputSection">

        <h2>Updated Resume</h2>

        <div
            id="resumeOutput"
            class="output-box"
        ></div>

        <div class="buttons">

            <button
                class="secondary-btn"
                onclick="copyResume()"
            >
                📋 Copy Resume
            </button>

            <button
                class="secondary-btn"
                onclick="printResume()"
            >
                🖨️ Save / Print PDF
            </button>

        </div>

    </div>

</div>


<script>

async function updateResume() {

    const resume = document.getElementById("resume").value.trim();
    const jd = document.getElementById("jd").value.trim();

    const generateBtn = document.getElementById("generateBtn");
    const loadingMessage = document.getElementById("loadingMessage");
    const errorMessage = document.getElementById("errorMessage");
    const successMessage = document.getElementById("successMessage");
    const outputSection = document.getElementById("outputSection");
    const resumeOutput = document.getElementById("resumeOutput");

    // Clear previous messages
    errorMessage.style.display = "none";
    successMessage.style.display = "none";

    // Validate inputs
    if (!resume) {
        errorMessage.textContent = "Please paste your current resume.";
        errorMessage.style.display = "block";
        return;
    }

    if (!jd) {
        errorMessage.textContent = "Please paste the target job description.";
        errorMessage.style.display = "block";
        return;
    }

    // Loading state
    generateBtn.disabled = true;
    generateBtn.textContent = "Generating...";
    loadingMessage.style.display = "block";

    try {

        /*
         * IMPORTANT:
         * The Gemini API key is NOT stored in this file.
         *
         * The request goes to our secure backend:
         * /api/generate
         */

        const response = await fetch("/api/generate", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                resume: resume,
                jd: jd
            })

        });


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "Unable to generate the updated resume."
            );

        }


        if (!data.text) {

            throw new Error(
                "The AI returned an empty response."
            );

        }


        // Display generated resume
        resumeOutput.textContent = data.text;

        outputSection.style.display = "block";

        successMessage.style.display = "block";

        // Scroll to output
        outputSection.scrollIntoView({
            behavior: "smooth"
        });

    }

    catch (error) {

        console.error(error);

        errorMessage.textContent =
            error.message ||
            "Something went wrong. Please try again.";

        errorMessage.style.display = "block";

    }

    finally {

        generateBtn.disabled = false;

        generateBtn.textContent =
            "Generate Updated Resume";

        loadingMessage.style.display = "none";

    }

}


/* COPY RESUME */

async function copyResume() {

    const resumeOutput =
        document.getElementById("resumeOutput");

    const text =
        resumeOutput.innerText;

    if (!text.trim()) {
        alert("There is no resume to copy.");
        return;
    }

    try {

        await navigator.clipboard.writeText(text);

        alert("Resume copied successfully!");

    }

    catch (error) {

        alert("Unable to copy the resume.");

    }

}


/* PRINT / SAVE PDF */

function printResume() {

    const output =
        document.getElementById("resumeOutput");

    if (!output.innerText.trim()) {
        alert("There is no resume to print.");
        return;
    }

    window.print();

}

</script>

</body>
</html>
